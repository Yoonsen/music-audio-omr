[project]
name = "music-audio-omr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "homr>=0.7.0",
    "jupyter>=1.1.1",
    "librosa>=1.0.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "opencv-python>=4.13.0.92",
]

[project.optional-dependencies]
# PDF rasterization for the homr OMR engine (Audiveris takes PDFs natively
# and doesn't need this). See omr/README.md.
omr = ["pypdfium2>=4.30"]
# homr is already a base dependency above; this extra is kept only so
# `uv sync --extra omr-homr` documented in omr/README.md still works.
# Audiveris (Java, not pip/uv-installable) is intentionally left out of
# this project's own dependencies — see omr/README.md.
omr-homr = ["homr"]
# `--score-png` on the CLI / omr.render.render_score_png: engraves an
# engine's MusicXML output back to a PNG via Verovio. Also needs
# `rsvg-convert` (SVG -> PNG) on PATH, e.g. `apt install librsvg2-bin` /
# `brew install librsvg` — not pip-installable, so not listed here.
omr-render = ["verovio>=6.3"]
